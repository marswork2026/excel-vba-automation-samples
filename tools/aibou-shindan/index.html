<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>きょうの相棒キャラ診断｜mars works</title>
<meta name="description" content="3つの質問で、きょうの相棒を見つけよう。今日の気分で楽しむミニ診断です。">
<style>
  :root{--bg:#FFF8EE;--card:#FFFFFF;--ink:#4A3A33;--sub:#8A7468;--accent:#F2B45C;--accent2:#E9B8C4;--line:#EADBC8}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;-webkit-text-size-adjust:100%}
  main{max-width:480px;margin:0 auto;padding:20px 16px 40px;min-height:100vh}
  .screen{display:none}
  .screen.on{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:clamp(21px,6.6vw,26px);margin:8px 0 6px;text-align:center;letter-spacing:.02em}
  .lead,.card .line,.card .intro,.q{word-break:auto-phrase;text-wrap:balance}
  .lead{text-align:center;margin:0 0 4px;font-size:16px}
  .note{text-align:center;color:var(--sub);font-size:13px;margin:0 0 18px}
  .five{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin:14px 0 18px;flex-wrap:nowrap}
  .five img{height:64px;width:auto}
  .five img.big{height:78px}
  button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .btn{display:block;width:100%;border:0;border-radius:16px;padding:16px 12px;font-size:18px;font-weight:700;margin:10px 0;background:var(--accent);color:#4A3A33;box-shadow:0 3px 0 #D9963A}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #D9963A}
  .btn.sub{background:#fff;border:2px solid var(--line);box-shadow:none;font-size:16px;font-weight:600;padding:13px 12px}
  .btn[disabled]{opacity:.6}
  .meta{text-align:center;color:var(--sub);font-size:13px}
  .progress{text-align:center;color:var(--sub);font-size:14px;margin:6px 0 4px}
  .q{font-size:22px;text-align:center;margin:18px 0 22px;font-weight:700}
  .choice{display:block;width:100%;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:22px 12px;font-size:20px;font-weight:700;margin:12px 0}
  .choice:active{background:#FFF1DC}
  .wait{text-align:center;font-size:20px;padding:120px 0}
  .card{background:var(--card);border-radius:22px;padding:18px 16px 20px;border:2px solid var(--line);text-align:center}
  .card .kicker{color:var(--sub);font-size:14px;margin:0}
  .card .name{font-size:32px;font-weight:800;margin:2px 0 8px}
  .card img{height:170px;width:auto;margin:4px auto 8px;display:block}
  .card .line{font-size:19px;font-weight:700;margin:6px 0 10px;line-height:1.5}
  .card .intro{font-size:14px;color:var(--sub);margin:0}
  .row{display:flex;gap:10px}
  .row .btn{margin:10px 0}
  .links{margin-top:18px;border-top:1px dashed var(--line);padding-top:10px}
  a.link{display:block;text-align:center;padding:14px 10px;border-radius:14px;background:#fff;border:2px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;margin:10px 0}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#4A3A33;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.on{opacity:.95}
  #saveBox,#copyBox{display:none;margin-top:12px;text-align:center}
  #saveBox img{width:100%;border-radius:12px;border:1px solid var(--line)}
  #copyBox textarea{width:100%;height:96px;font:inherit;font-size:14px;border-radius:10px;border:1px solid var(--line);padding:8px}
  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:26px}
  .err{background:#fff3f3;border:1px solid #f0c0c0;padding:10px;border-radius:10px;font-size:14px;display:none;margin-top:10px}
</style>
</head>
<body>
<main>
  <section class="screen on" id="s-start" aria-live="polite">
    <div class="five" aria-hidden="true">
      <img alt="" data-k="chaki"><img alt="" data-k="mameji"><img alt="" class="big" data-k="riri"><img alt="" data-k="hamugi"><img alt="" data-k="mocha">
    </div>
    <h1>きょうの相棒キャラ診断</h1>
    <p class="lead">3つの質問で、きょうの相棒を見つけよう。</p>
    <p class="note">今日の気分で楽しむミニ診断です。</p>
    <button class="btn" id="startBtn">診断スタート</button>
    <p class="meta">約20秒・入力なし</p>
  </section>

  <section class="screen" id="s-q">
    <p class="progress" id="prog">1 / 3</p>
    <p class="q" id="qText"></p>
    <button class="choice" id="cA"></button>
    <button class="choice" id="cB"></button>
  </section>

  <section class="screen" id="s-wait"><p class="wait">あなたの今日の相棒は……</p></section>

  <section class="screen" id="s-result">
    <div class="card">
      <p class="kicker">今日の相棒</p>
      <p class="name" id="rName"></p>
      <img id="rImg" alt="">
      <p class="line" id="rLine"></p>
      <p class="intro" id="rIntro"></p>
    </div>
    <div class="row">
      <button class="btn sub" id="saveBtn">画像で保存</button>
      <button class="btn sub" id="copyBtn">結果をコピー</button>
    </div>
    <div id="saveBox"><p class="meta" id="saveMsg">画像を長押しして保存できます</p><img id="saveImg" alt="診断結果の画像"></div>
    <div id="copyBox"><p class="meta">うまくコピーできない場合は、下の文章を選んでコピーしてください</p><textarea id="copyText" readonly></textarea></div>
    <button class="btn" id="againBtn">もう一度診断する</button>
    <div class="links">
      <a class="link" id="link1" target="_blank" rel="noopener"></a>
      <a class="link" id="link2" target="_blank" rel="noopener"></a>
    </div>
    <div class="err" id="err"></div>
  </section>

  <footer>© mars works ｜ オリジナルキャラクター「ちゃき・りり・まめじ・もちゃ・はむぎ」</footer>
</main>
<div class="toast" id="toast"></div>

var state = {step:0, answers:"", busy:false, result:null, line:""};
function $(id){return document.getElementById(id);}
function show(id){
  var s=document.querySelectorAll(".screen");
  for(var i=0;i<s.length;i++){s[i].classList.remove("on");}
  $(id).classList.add("on");
  window.scrollTo(0,0);
}
function toast(msg){var t=$("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("on");},1800);}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function judge(ans){ return MAP.hasOwnProperty(ans) ? MAP[ans] : null; }

function renderQ(){
  var q=QUESTIONS[state.step];
  $("prog").textContent=(state.step+1)+" / "+QUESTIONS.length;
  $("qText").textContent=q.q; $("cA").textContent=q.a; $("cB").textContent=q.b;
  state.busy=false;
}
function start(){
  state.step=0; state.answers=""; state.result=null; state.busy=false;
  $("saveBox").style.display="none"; $("copyBox").style.display="none"; $("err").style.display="none";
  renderQ(); show("s-q");
}
function answer(ch){
  if(state.busy) return;           // 連打防止
  state.busy=true;
  state.answers+=ch;
  state.step++;
  if(state.step<QUESTIONS.length){ setTimeout(renderQ,120); return; }
  show("s-wait");
  setTimeout(function(){ finish(state.answers); },800);
}
function finish(ans){
  var k=judge(ans);
  if(!k){ start(); return; }
  var c=CHARS[k]; state.result=k; state.line=pick(c.lines);
  $("rName").textContent=c.name;
  var img=$("rImg"); img.alt=c.name; img.src=IMG[k]||"";
  $("rLine").textContent="「"+state.line+"」";
  $("rIntro").textContent=c.intro;
  $("link1").textContent=c.link.label; $("link1").href=c.link.url;
  $("link2").textContent=LINK2.label; $("link2").href=LINK2.url;
  state.busy=false;
  show("s-result");
}
function shareText(){
  var c=CHARS[state.result];
  return "今日の相棒は「"+c.name+"」でした！\n"+state.line+"\n#きょうの相棒キャラ診断";
}
function copyResult(){
  if(!state.result) return;
  var txt=shareText();
  function fallback(){
    var ta=$("copyText"); ta.value=txt; $("copyBox").style.display="block";
    try{ ta.focus(); ta.select(); if(document.execCommand && document.execCommand("copy")){ toast("コピーしました"); return; } }catch(e){}
    toast("下の文章を選んでコピーしてください");
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(function(){toast("コピーしました");},fallback);
  } else { fallback(); }
}
function loadImg(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i);};i.onerror=rej;i.src=src;});}
function wrapText(ctx,text,maxW){
  var lines=[],cur="";
  for(var i=0;i<text.length;i++){var t=cur+text[i]; if(ctx.measureText(t).width>maxW && cur){lines.push(cur);cur=text[i];} else cur=t;}
  if(cur) lines.push(cur); return lines;
}
var saving=false;
function saveResult(){
  if(!state.result || saving) return;   // 連打防止
  saving=true; $("saveBtn").disabled=true;
  var c=CHARS[state.result];
  loadImg(IMG[state.result]).then(function(img){
    var W=1080,H=1350,cv=document.createElement("canvas"); cv.width=W; cv.height=H;
    var x=cv.getContext("2d"); var F='"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif';
    x.fillStyle="#FFF8EE"; x.fillRect(0,0,W,H);
    x.fillStyle="#FFFFFF"; roundRect(x,60,60,W-120,H-120,48); x.fill();
    x.strokeStyle="#EADBC8"; x.lineWidth=6; roundRect(x,60,60,W-120,H-120,48); x.stroke();
    x.fillStyle="#8A7468"; x.textAlign="center"; x.textBaseline="alphabetic";
    x.font="600 40px "+F; x.fillText("きょうの相棒は？",W/2,190);
    x.fillStyle="#4A3A33"; x.font="800 96px "+F; x.fillText(c.name,W/2,310);
    var maxH=520, s=Math.min(maxH/img.height, 700/img.width, 2.4); var iw=img.width*s, ih=img.height*s;
    x.imageSmoothingEnabled=true; x.imageSmoothingQuality="high";
    x.drawImage(img,(W-iw)/2,360+(maxH-ih)/2,iw,ih);
    x.font="700 50px "+F; var ls=splitLine(x,"「"+state.line+"」",W-240);
    for(var i=0;i<ls.length;i++){ x.fillText(ls[i],W/2,990+i*70); }
    x.fillStyle="#8A7468"; x.font="500 34px "+F; x.fillText("#きょうの相棒キャラ診断　mars works",W/2,H-110);
    return new Promise(function(res){ if(cv.toBlob){cv.toBlob(function(b){res({blob:b,url:cv.toDataURL("image/png")});},"image/png");} else res({blob:null,url:cv.toDataURL("image/png")}); });
  }).then(function(r){
    $("saveImg").src=r.url; $("saveBox").style.display="block";
    var name="aibou_"+state.result+".png";
    try{
      var a=document.createElement("a"); a.href=r.blob?URL.createObjectURL(r.blob):r.url; a.download=name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      toast("画像を作りました");
    }catch(e){ toast("画像を長押しして保存してください"); }
  }).catch(function(){
    var e=$("err"); e.textContent="画像を作れませんでした。お手数ですが、画面のスクリーンショットで保存してください。"; e.style.display="block";
  }).then(function(){ saving=false; $("saveBtn").disabled=false; });
}
function splitLine(ctx,text,maxW){
  if(ctx.measureText(text).width<=maxW) return [text];
  var best=-1,mid=text.length/2;
  for(var i=0;i<text.length;i++){ if(text[i]==="、"||text[i]==="，"){ if(best<0||Math.abs(i-mid)<Math.abs(best-mid)) best=i; } }
  if(best>0){ var a=text.slice(0,best+1), b=text.slice(best+1);
    if(ctx.measureText(a).width<=maxW && ctx.measureText(b).width<=maxW) return [a,b]; }
  return wrapText(ctx,text,maxW);
}
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
